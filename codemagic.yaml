workflows:
  ios-app-store:
    name: 予你旅行 · App Store Connect
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: yunilvxing
    environment:
      xcode: latest
      groups:
        - youni_release
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yunilvxing.app
    scripts:
      - name: Inject private login configuration
        script: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import base64, os, plistlib
          from pathlib import Path
          encoded = os.environ.get('TRAVEL_LOGIN_PLIST_BASE64', '')
          if not encoded:
              raise SystemExit('Configure TRAVEL_LOGIN_PLIST_BASE64 in youni_release.')
          try:
              config = plistlib.loads(base64.b64decode(encoded, validate=True))
              values = config['com.yunilvxing.app']
              if not isinstance(values.get('SDKInfo'), str) or not values['SDKInfo'].strip():
                  raise ValueError()
          except Exception:
              raise SystemExit('The private login configuration is invalid or does not match com.yunilvxing.app.')
          target = Path('yunilvyou/yunilvyou/TravelLogin.local.plist')
          target.write_bytes(plistlib.dumps(config))
          target.chmod(0o600)
          PY
      - name: Apply distribution signing profiles
        script: xcode-project use-profiles
      - name: Archive and export IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project yunilvyou/yunilvyou.xcodeproj \
            --scheme yunilvyou \
            --config Release \
            --archive-xcargs "IPHONEOS_DEPLOYMENT_TARGET=15.6 CURRENT_PROJECT_VERSION=$((${BUILD_NUMBER:-1} + 100))"
      - name: Verify exported app
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, plistlib, zipfile
          files = glob.glob('build/ios/ipa/*.ipa')
          if len(files) != 1:
              raise SystemExit('Expected one exported IPA.')
          with zipfile.ZipFile(files[0]) as ipa:
              names = ipa.namelist()
              info_path = next(p for p in names if p.startswith('Payload/') and p.count('/') == 2 and p.endswith('/Info.plist'))
              info = plistlib.loads(ipa.read(info_path))
              prefix = info_path.removesuffix('Info.plist')
              assert info['CFBundleIdentifier'] == 'com.yunilvxing.app'
              assert info['MinimumOSVersion'] == '15.6'
              assert prefix + 'TravelLogin.local.plist' in names
          PY
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive/dSYMs/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_app_store: false

workflows:
  ios-app-store:
    name: 予你旅行 · App Store IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - youni_release
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yunilvxing.app
    scripts:
      - name: Inject private login configuration
        script: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import base64, ipaddress, os, plistlib
          from pathlib import Path
          from urllib.parse import urlsplit
          encoded = os.environ.get('TRAVEL_LOGIN_PLIST_BASE64', '')
          api = os.environ.get('APP_API_BASE_URL', '').strip()
          if not encoded or not api:
              raise SystemExit('Configure TRAVEL_LOGIN_PLIST_BASE64 and APP_API_BASE_URL in youni_release.')
          url = urlsplit(api)
          if url.scheme != 'https' or not url.hostname or url.username or url.password or url.query or url.fragment:
              raise SystemExit('APP_API_BASE_URL must be an HTTPS API base URL without credentials, query or fragment.')
          try:
              address = ipaddress.ip_address(url.hostname)
          except ValueError:
              if url.hostname == 'localhost' or url.hostname.endswith(('.local', '.localhost')):
                  raise SystemExit('A public API endpoint is required for distribution.')
          else:
              if not address.is_global:
                  raise SystemExit('A LAN or loopback API endpoint cannot be used for distribution.')
          try:
              config = plistlib.loads(base64.b64decode(encoded, validate=True))
              values = config['com.yunilvxing.app']
              if not isinstance(values.get('SDKInfo'), str) or not values['SDKInfo'].strip():
                  raise ValueError()
          except Exception:
              raise SystemExit('The private login configuration is invalid or does not match com.yunilvxing.app.')
          values['APIBaseURL'] = api.rstrip('/') + '/'
          target = Path('yunilvyou/yunilvyou/TravelLogin.local.plist')
          target.write_bytes(plistlib.dumps(config))
          target.chmod(0o600)
          print('Private login configuration prepared; values are hidden.')
          PY
      - name: Apply distribution signing profiles
        script: xcode-project use-profiles
      - name: Archive and export IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project yunilvyou/yunilvyou.xcodeproj \
            --scheme yunilvyou \
            --config Release \
            --archive-xcargs "IPHONEOS_DEPLOYMENT_TARGET=15.6 CURRENT_PROJECT_VERSION=$((${BUILD_NUMBER:-1} + 100))"
      - name: Verify exported app
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, plistlib, zipfile
          files = glob.glob('build/ios/ipa/*.ipa')
          if len(files) != 1:
              raise SystemExit('Expected one exported IPA.')
          with zipfile.ZipFile(files[0]) as ipa:
              names = ipa.namelist()
              info_path = next(p for p in names if p.startswith('Payload/') and p.count('/') == 2 and p.endswith('/Info.plist'))
              info = plistlib.loads(ipa.read(info_path))
              prefix = info_path.removesuffix('Info.plist')
              assert info['CFBundleIdentifier'] == 'com.yunilvxing.app'
              assert info['MinimumOSVersion'] == '15.6'
              assert prefix + 'TravelLogin.local.plist' in names
              print('IPA verified: com.yunilvxing.app; minimum iOS 15.6; login configuration included.')
          PY
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive/dSYMs/*.dSYM
      - /tmp/xcodebuild_logs/*.log

  ios-build-check:
    name: 予你旅行 · Release 编译检查（不可安装）
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Compile Release for iPhone without signing
        script: |
          set -euo pipefail
          xcodebuild -project yunilvyou/yunilvyou.xcodeproj \
            -scheme yunilvyou -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/youni-release-check \
            IPHONEOS_DEPLOYMENT_TARGET=15.6 CODE_SIGNING_ALLOWED=NO build
